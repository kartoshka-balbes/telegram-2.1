name: Распаковка новой версии

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v4

      - name: Распаковать новую версию
        run: |
          ARCHIVE="telegram-final-04-11.zip"
          TEMP_DIR=$(mktemp -d)

          unzip -q "$ARCHIVE" -d "$TEMP_DIR"

          PACKAGE=$(find "$TEMP_DIR" -name package.json -print -quit)

          if [ -z "$PACKAGE" ]; then
            echo "package.json не найден!"
            exit 1
          fi

          SOURCE_DIR=$(dirname "$PACKAGE")

          rm -rf "$SOURCE_DIR/.github"

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            -exec rm -rf {} +

          cp -a "$SOURCE_DIR"/. .

          rm -f "$ARCHIVE"
          rm -rf "$TEMP_DIR"

      - name: Сохранить новую версию
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update to version 04-11-2026" || exit 0
          git push
